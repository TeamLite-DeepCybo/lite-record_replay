name: Build Windows EXE

# 打 tag（v*）或手动触发时，在 GitHub 的 Windows runner 上构建单文件 exe，
# 并挂到对应的 Release 上。用户不需要本地装什么工具链。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（只用于产物命名，例如 2.0.5-win）"
        required: false
        default: "2.0.5-win"

permissions:
  contents: write

jobs:
  build:
    name: exe (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest        # x64
            arch: x64
            platform: win_amd64
          - os: windows-11-arm        # arm64（GitHub 公测 runner）
            arch: arm64
            platform: win_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pip

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import check
        working-directory: app
        env:
          PYTHONUTF8: "1"
        run: python -c "import bhl, numpy, can, robstride_dynamics, tkinter; from bhl import config; print('imports ok, motors =', len(config.MOTORS))"

      - name: Build single-file exe
        env:
          PYTHONUTF8: "1"
        run: |
          # 注意：--specpath 会让 .spec 里的相对路径按 spec 所在目录解析，
          # 所以输入路径一律用绝对路径，避免 "Unable to find app/assets"。
          $root = (Get-Location).Path
          python -m PyInstaller `
            --noconfirm --clean --windowed --onefile `
            --name "LiteRecordReplay" `
            --icon "$root/app/assets/logo-emblem.ico" `
            --add-data "$root/app/assets;assets" `
            --add-data "$root/app/calibration.json;." `
            --paths "$root/app" `
            --distpath "$root/dist" --workpath "$root/build" --specpath "$root/build" `
            "$root/app/main.py"

      - name: Smoke test
        run: |
          $exe = "dist/LiteRecordReplay.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }
          $size = (Get-Item $exe).Length
          Write-Host "exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 5MB) { throw "exe is suspiciously small - the bundle is probably incomplete" }

          # 硬校验：--version 必须正常退出（argparse 走 sys.exit(0)）
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru -Wait
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          Write-Host "version check passed"

          # 软校验：GUI 能起来并活过 8 秒（CI 无交互桌面时可能起不来，不判失败）
          $g = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($g.HasExited) {
            Write-Warning "GUI exited early (code $($g.ExitCode)) - runner may have no desktop session"
          } else {
            Stop-Process -Id $g.Id -Force
            Write-Host "gui smoke test passed"
          }

      - name: Package
        id: pack
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "${{ github.ref_name }}" -replace '^v', '' }
          $name = "LiteRecordReplay-$ver-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "packaging/$name" | Out-Null
          Copy-Item "dist/LiteRecordReplay.exe" "packaging/$name/"
          Copy-Item "app/calibration.json" "packaging/$name/" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "packaging/$name/data/motions" | Out-Null
          # 用 ASCII 文件名：Compress-Archive 会用系统代码页存中文名，英文 Windows 上会乱码
          Copy-Item "windows/README.md" "packaging/$name/README.md"
          "name=$name" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path "packaging/$name" -DestinationPath "$name.zip" -Force
          "把 exe 和它旁边的 data/、calibration.json 一起解压即可"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "Automated build for $tag"
          gh release upload "$tag" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
