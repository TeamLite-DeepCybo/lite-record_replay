name: Build Windows EXE

# 打 tag（v*）或手动触发时，在 GitHub 的 Windows runner 上构建单文件 exe，
# 并挂到对应的 Release 上。用户不需要本地装什么工具链。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（只用于产物命名，例如 2.0.5-win）"
        required: false
        default: "2.0.5-win"

permissions:
  contents: write

jobs:
  build:
    name: exe (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest        # x64
            arch: x64
            platform: win_amd64
          - os: windows-11-arm        # arm64（GitHub 公测 runner）
            arch: arm64
            platform: win_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pip

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import check
        working-directory: app
        env:
          PYTHONUTF8: "1"
        run: python -c "import bhl, numpy, can, robstride_dynamics, tkinter; from bhl import config; print('imports ok, motors =', len(config.MOTORS))"

      - name: USB-CAN import check
        working-directory: app
        env:
          PYTHONUTF8: "1"
        run: |
          # candleLight / CANable 走 gs_usb 后端：pyusb + gs_usb 包 + libusb-1.0.dll
          python -c "import usb, usb.backend.libusb1, gs_usb, libusb_package; print('usb stack ok')"
          python -c "import bhl.libusb as l; print('libusb backend:', l.ensure(), l.describe())"

      - name: Build single-file exe
        env:
          PYTHONUTF8: "1"
        run: |
          # 注意：--specpath 会让 .spec 里的相对路径按 spec 所在目录解析，
          # 所以输入路径一律用绝对路径，避免 "Unable to find app/assets"。
          $root = (Get-Location).Path
          # python-can 的后端是按名字动态 import 的，PyInstaller 静态分析看不到，
          # 必须显式 hidden-import，否则运行时 "Cannot import module can.interfaces.gs_usb"
          # `candle` 是独立插件包：入口 candle.candle_bus + entry point 元数据
          # （--copy-metadata python-can-candle）缺一不可。少了元数据，python-can
          # 就认不出 "candle" 这个名字，扫描子进程会报
          # CanInterfaceNotImplementedError: Unknown interface type "candle"
          $backends = @("gs_usb","pcan","canalystii","slcan","serial","kvaser","vector",
                        "systec","ixxat","usb2can","cantact","socketcan","socketcand",
                        "udp_multicast","virtual")
          $hidden = @()
          foreach ($b in $backends) { $hidden += @("--hidden-import", "can.interfaces.$b") }
          python -m PyInstaller `
            --noconfirm --clean --windowed `
            --name "LiteRecordReplay" `
            --icon "$root/app/assets/logo-emblem.ico" `
            --add-data "$root/app/assets;assets" `
            --add-data "$root/app/calibration.json;." `
            --paths "$root/app" `
            --hidden-import "usb.backend.libusb1" `
            --hidden-import "candle.candle_bus" `
            --collect-all candle `
            --collect-all candle_api `
            --copy-metadata python-can-candle `
            @hidden `
            --collect-submodules gs_usb `
            --collect-all libusb_package `
            --distpath "$root/dist" --workpath "$root/build" --specpath "$root/build" `
            "$root/app/main.py"

      - name: Smoke test
        run: |
          # 目录版（--onedir）：exe 直接启动，不解压到临时目录
          $dir = "dist/LiteRecordReplay"
          $exe = "$dir/LiteRecordReplay.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }
          if (-not (Test-Path "$dir/_internal")) { throw "_internal not found - onedir bundle is incomplete" }
          $total = (Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "bundle size: $([math]::Round($total / 1MB, 1)) MB"
          if ($total -lt 20MB) { throw "bundle is suspiciously small - the bundle is probably incomplete" }

          # 硬校验：--version 必须正常退出（argparse 走 sys.exit(0)）
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru -Wait
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          Write-Host "version check passed"

          # 硬校验：--diagnose 必须写出报告，且 python-can 的厂商后端真的能用
          # （之前 exe 缺 can.interfaces.gs_usb 就是这么漏掉的）
          Remove-Item "$dir/can-diagnose.txt" -ErrorAction SilentlyContinue
          $d = Start-Process -FilePath $exe -ArgumentList "--diagnose" -PassThru -Wait
          if ($d.ExitCode -ne 0) { throw "--diagnose exited with $($d.ExitCode)" }
          if (-not (Test-Path "$dir/can-diagnose.txt")) { throw "--diagnose wrote no report" }
          $report = Get-Content "$dir/can-diagnose.txt" -Raw
          Write-Host $report
          foreach ($needle in @("gs_usb", "libusb", "CAN 适配器")) {
            if ($report -notmatch [regex]::Escape($needle)) { throw "report is missing '$needle'" }
          }
          if ($report -match "No module named 'can\.interfaces") { throw "a python-can backend is missing from the bundle" }
          Write-Host "diagnose check passed"

          # 软校验：GUI 能起来并活过 8 秒（CI 无交互桌面时可能起不来，不判失败）
          $g = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($g.HasExited) {
            Write-Warning "GUI exited early (code $($g.ExitCode)) - runner may have no desktop session"
          } else {
            Stop-Process -Id $g.Id -Force
            Write-Host "gui smoke test passed"
          }

      - name: Package
        id: pack
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "${{ github.ref_name }}" -replace '^v', '' }
          $name = "LiteRecordReplay-$ver-${{ matrix.arch }}"
          $dest = "packaging/$name"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # 整体搬目录版：exe + _internal/（启动不解压，秒开）
          Copy-Item "dist/LiteRecordReplay/*" $dest -Recurse -Force
          Copy-Item "app/calibration.json" $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dest/data/motions" | Out-Null
          # 用 ASCII 文件名：Compress-Archive 会用系统代码页存中文名，英文 Windows 上会乱码
          Copy-Item "windows/README.md" "$dest/README.md"
          "name=$name" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path $dest -DestinationPath "$name.zip" -Force
          "解压后双击 LiteRecordReplay.exe 即可（旁边必须有 _internal 目录）"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "Automated build for $tag"
          gh release upload "$tag" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
